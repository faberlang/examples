[package]
name = "bert-tiny-fragment"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "train.fab"

[build]
target = "fmir"
kind = "bin"

# S6-U8 device section (stage-6-delivery.md §S6-U8): the migrated BERT-tiny
# package follows the Stage 5 MLP route. `backend = "auto"` is the manifest
# default (CLI > manifest > auto); `steps` is the declared RepeatingStep count
# and is validated against the source loop's constant bound (8) — a mismatch
# fails closed. `inputs` are the host-provided once-init values for the
# device-program input buffers (frozen input/dk_scale/target, the 18 trainable
# parameters — HostProvided init, copied in exactly once at session creation —
# and the lr scalar). Biases are per-channel [8]. Values are the pinned oracle
# initial values (oracle/capture.txt initial_* markers, verbatim stepper f64
# Display strings).
