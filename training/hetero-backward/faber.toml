# G3 heterogeneous-output fixture (gpu-training stage-3r): the differentiable
# device workload `loss = sum(x)` over x: tf32[4], with the AIR-generated
# backward companion `hetero_backward` returning a genuinely heterogeneous
# gradient tuple (grad_x: tf32[4], grad_w: tf32[2]).
#
# The two gradient outputs have DIFFERENT extents ([4] and [2]) — the
# Stage 4 MLP oracle pressure shape (consumer pressure only — not Stage 5).
# Per-output dispatch and bounds evidence is required by G3; no shared
# dispatch extent may overrun the smaller buffer or leave the larger one
# incomplete.
[package]
name = "hetero-backward"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "hetero_backward.fab"

[build]
target = "fmir"
kind = "bin"

# The device surface opt-in: the image carries a `device` section (device
# program + MSL/PTX artifacts + canonical payload). `auto` resolves against
# the machine's admitted backends at run time; `--backend metal|cuda` on the
# command line overrides this.
[device]
backend = "auto"
inputs = { x = [
    1.0, 2.0, 3.0, 4.0
], w = [
    5.0, 6.0
] }

[reader]
locale = "la"
