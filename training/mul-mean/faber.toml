# S3-B1 non-exact Mul+Mean fixture (gpu-training-lowering) — the C3
# honesty gate. The differentiable device workload is `loss = mean(x · w)`
# over N = 1000 elements with the AIR-generated backward companion
# `loss_backward(x, w, nil(), upstream) → iuncta(grad_x, grad_w)`.
#
# INPUTS ARE DELIBERATELY NON-HALF-INTEGER / NON-STRUCTURALLY-EXACT:
#   N = 1000 (wide; not a power of two),
#   x[i] = (10·(i+1)+3)/100, w[i] = (10·(i+1)+7)/100.
# The analytic gradients x[i]/N and w[i]/N reduce to fractions whose
# denominators keep a factor 5^4/5^5 (numerators are ≡ 3 / 7 mod 5, never
# divisible by 5), so NO gradient element is exactly representable in f32 and
# the 1/N division + wide mean accumulation round — the numeric-policy
# v1.0.0 gradient floor (atol = rtol = 1e-4, FD central eps = 1e-3) is a real
# limit, never a delta-0 backstop. See oracle/README.md for the full
# representability argument and oracle/tools/honesty_check.py for the proof.
[package]
name = "mul-mean"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "mul_mean.fab"

[build]
target = "fmir"
kind = "bin"

# The device surface opt-in: the image carries a `device` section (device
# program + MSL/PTX artifacts + canonical payload). `auto` resolves against
# the machine's admitted backends at run time; `--backend metal|cuda` on the
