[package]
name = "bert-gradus-probe"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "train.fab"

[build]
target = "fmir"
kind = "bin"

# CPU-only probe — no [device] section (the S6-G1 validation probe runs
# through the ordinary `faber run -t fmir` CPU route, like the fragment).

[reader]
# la (Q2 corpus la-pass, want 39c43851): the package source uses the Latin
# keyword surface (functio/fixum/si/…); en-pack authority (locale S2-U1) makes
# Latin-keyword sources uncompilable under en. Flip to en only when the source
# is converted to the en keyword surface.
locale = "la"
