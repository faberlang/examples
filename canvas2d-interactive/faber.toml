[package]
name = "canvas2d-interactive"
version = "0.1.0"
edition = "2026"

[paths]
entry = "main.fab"

[build]
target = "ts"
kind = "bin"

[product]
kind = "browser-app"
emit = "typescript"
out = "dist"
templates = "pages"
controllers_json = "controllers.json"

[dependencies]
tela = "0.1.0"

# STAYS la (not en): the fixture source uses the Latin keyword surface
# (functio/fixum/importa/…); pack-authority lookup (web-mig U5) requires the
# la pack for Latin spellings. Flip to en when the source is converted.
[reader]
locale = "la"
