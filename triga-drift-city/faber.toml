[package]
name = "triga-drift-city"
version = "0.1.0"
edition = "2026"

[paths]
entry = "main.fab"

[build]
target = "ts"
kind = "bin"

[product]
kind = "browser-app"
emit = "typescript"
out = "dist"
templates = "pages"
styles = "styles"
controllers_json = "controllers.json"

[product.shaders]
source = "src/shaders/test-data"

[dependencies]
tela = "0.1.0"
triga = "0.1.0"

# STAYS la (not en): triga library members subtracta/multiplicata/productum/transversum
# are not en-declared in radix stdlib/locale/en/pack.toml yet (hand-8 residual 3);
# flip to en when the en pack rows exist.
[reader]
locale = "la"
