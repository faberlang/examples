<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triga Drift City — Application Foundation</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <main id="triga-drift-city">
    <header>
      <p class="eyebrow">Faber application foundation</p>
      <h1>Triga Drift City</h1>
      <p class="summary">Direct-WebGPU render with U1 greybox shader pipeline. First colored triangle verified via pixel readback.</p>
    </header>

    <section class="drift-panel" aria-labelledby="drive-title">
      <h2 id="drive-title">Render facts</h2>
      <p class="drift-status" aria-live="polite">initializing</p>
      <div class="drift-facts" tabindex="0" role="application" aria-label="Triga Drift City render facts">
        <p data-fact="pipeline-status">Pipeline: pending</p>
        <p data-fact="pixel-readback">Pixel readback: pending</p>
        <p data-fact="render-status">Render status: pending</p>
      </div>
    </section>

    <canvas class="drift-canvas" width="960" height="540" aria-label="Triga Drift City render target"></canvas>

    <aside>
      <strong>Renderer status:</strong> <span id="renderer-status">initializing WebGPU host…</span>
    </aside>
  </main>
  <script type="module">
    import { initHost } from "../public/host-init.js";

    const root = globalThis.document.querySelector("#triga-drift-city");
    const statusEl = root?.querySelector(".drift-status");
    const factsEl = root?.querySelector(".drift-facts");
    const rendererStatus = globalThis.document.querySelector("#renderer-status");

    async function main() {
      try {
        const host = await initHost();

        if (statusEl) {
          statusEl.textContent = host.pipelineLoaded ? "render-active" : "pipeline-failed";
        }

        if (rendererStatus) {
          rendererStatus.textContent = host.pipelineLoaded
            ? `active — pixel readback: ${host.renderStatus}`
            : "pipeline load failed";
        }

        // Update fact elements from host data attributes
        if (factsEl) {
          const pipelineFact = factsEl.querySelector('[data-fact="pipeline-status"]');
          if (pipelineFact) {
            pipelineFact.textContent = `Pipeline: ${host.pipelineLoaded ? "loaded" : "failed"}`;
          }
          const pixelFact = factsEl.querySelector('[data-fact="pixel-readback"]');
          if (pixelFact) {
            const readbackStatus = host.readbackSamples
              ? `verified — center: ${host.readbackSamples.find(s => s.name === "center")?.hex || "unknown"}`
              : host.renderStatus === "failed" ? "failed" : "pending";
            pixelFact.textContent = `Pixel readback: ${readbackStatus}`;
          }
          const renderFact = factsEl.querySelector('[data-fact="render-status"]');
          if (renderFact) {
            renderFact.textContent = `Render status: ${host.renderStatus}`;
          }
        }

        globalThis.__driftHost = host;
      } catch (err) {
        console.error("host-init failed", err);
        if (statusEl) {
          statusEl.textContent = "host-init-failed";
        }
        if (rendererStatus) {
          rendererStatus.textContent = `failed: ${err.message}`;
        }
        if (root) {
          root.setAttribute("data-mount-error", err.message);
        }
      }
    }

    main();
  </script>
</body>
</html>
